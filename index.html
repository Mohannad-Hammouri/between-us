<style id="css-host" media="not all">
:root {
  --gold: #f6c56b; --red: #ff4d5e; --teal: #34e0c0; --text: #f6f2ea; --muted: #b3b5c8;

}
* { box-sizing: border-box; }

#c3d { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

.layer { position: fixed; inset: 0; pointer-events: none; }
.layer > * { pointer-events: auto; }
.hidden { display: none !important; }
.glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 1.4vw; }

}

.lobbybar { position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%); display: flex; gap: 1vw; align-items: stretch; }

}

@keyframes popin { from { transform: scale(0); opacity: 0 } }

/* ===== اللعب ===== */
.tbar { position: absolute; top: 2.6vh; left: 50%; transform: translateX(-50%); width: min(46vw, 900px); padding: 0.8vw 1.2vw; }

.trow b { font-family: 'Lalezar', sans-serif; font-weight: 400; font-size: 1.3em; color: var(--teal); }

.fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 99px; background: linear-gradient(90deg, #13a387, #4ff0d0); box-shadow: 0 0 22px rgba(52, 224, 192, .85); transition: width 1s cubic-bezier(.2, .8, .2, 1); }
.ticks { position: absolute; inset: 0; display: flex; }
.ticks i { flex: 1; border-left: 2px solid rgba(5, 6, 13, 0.35); }
.corner { position: absolute; top: 2.6vh; right: 2vw; padding: 0.6vw 1.2vw; display: flex; flex-direction: column; align-items: flex-end; }
.corner .lg { font: 400 clamp(26px, 2.6vw, 56px) 'Lalezar', sans-serif; color: var(--gold); line-height: 1; }
.corner .sm { font-size: clamp(11px, 0.9vw, 18px); color: var(--muted); }

<style id="css-phone" media="not all">
:root {
  --bg: #090b16;
  --bg2: #12162a;
  --glass: rgba(255, 255, 255, 0.07);
  --glass2: rgba(255, 255, 255, 0.11);
  --line: rgba(255, 255, 255, 0.14);
  --text: #f4f1ea;
  --muted: #a7a9bd;
  --gold: #f6c56b;
  --gold2: #e89a3c;
  --red: #ff4d5e;
  --red2: #c21d3a;
  --teal: #34e0c0;
  --blue: #6aa8ff;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'Cairo', system-ui, sans-serif; user-select: none; -webkit-user-select: none;
  touch-action: none; overscroll-behavior: none;
}
button { font-family: inherit; color: inherit; }
.ico { display: inline-flex; width: 1em; height: 1em; }
.ico svg { width: 100%; height: 100%; }
.hidden { display: none !important; }

/* ===== شاشات عامة ===== */
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b)); overflow-y: auto; touch-action: pan-y;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255, 90, 90, 0.18), transparent 60%),
    radial-gradient(90% 50% at 100% 100%, rgba(80, 120, 255, 0.14), transparent 60%),
    linear-gradient(180deg, #0c0f1f, #070812);
}
.logo {
  font-family: 'Lalezar', 'Cairo', sans-serif; font-size: 64px; line-height: 1; margin: 6px 0 0;
  background: linear-gradient(180deg, #fff3d6 0%, #f6c56b 45%, #d5462e 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255, 80, 60, 0.35));
  animation: flick 6s infinite;
}
@keyframes flick { 0%, 92%, 100% { opacity: 1 } 93% { opacity: .55 } 94% { opacity: 1 } 96% { opacity: .7 } }
.tagline { color: var(--muted); font-size: 14px; margin-top: 4px; letter-spacing: .2px; }

.card {
  width: 100%; max-width: 440px; background: var(--glass); border: 1px solid var(--line);
  border-radius: 22px; padding: 16px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.label { font-size: 13px; color: var(--muted); margin: 14px 2px 8px; font-weight: 600; }
.input {
  width: 100%; height: 52px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25);
  color: var(--text); font: 600 19px 'Cairo', sans-serif; padding: 0 16px; outline: none; text-align: center;
}
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246, 197, 107, 0.18); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 58px; border: 0; border-radius: 18px; padding: 0 26px; font: 800 20px 'Cairo', sans-serif;
  background: linear-gradient(180deg, #ffd789, #e8963a); color: #2a1606;
  box-shadow: 0 10px 30px rgba(232, 150, 58, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  transition: transform .12s, filter .2s, opacity .2s;
}
.btn:active { transform: scale(.96); }
.btn[disabled] { filter: grayscale(.8); opacity: .45; }
.btn.wide { width: 100%; max-width: 440px; }
.btn.ghost { background: var(--glass2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.btn.red { background: linear-gradient(180deg, #ff6b78, #c21d3a); color: #fff; box-shadow: 0 10px 30px rgba(194, 29, 58, .45); }
.btn .ico { font-size: 24px; }

/* ===== الانضمام ===== */
#join .preview {
  position: relative; width: 190px; height: 190px; margin: 6px auto -6px;
}
#join .preview::before {
  content: ''; position: absolute; inset: 22% 10% 2%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(246, 197, 107, .35), transparent);
}
#join .preview canvas { position: relative; }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.swatch {
  aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; position: relative;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), 0 3px 10px rgba(0, 0, 0, .3); transition: transform .15s;
}
.swatch.sel { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 0 3px rgba(255, 255, 255, .25), 0 0 18px rgba(255, 255, 255, .35); }
.swatch.taken { opacity: .25; }
.swatch.taken::after { content: ''; position: absolute; inset: 45% -6%; background: #fff; transform: rotate(-35deg); border-radius: 2px; }
.hats { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; touch-action: pan-x; }
.hats::-webkit-scrollbar { display: none; }
.hat {
  flex: 0 0 76px; height: 92px; border-radius: 16px; background: rgba(0, 0, 0, .25); border: 2px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; font-size: 12px; color: var(--muted);
}
.hat.sel { border-color: var(--gold); background: rgba(246, 197, 107, .12); color: var(--text); }
.code-row { display: flex; gap: 8px; }
.code-row .input { letter-spacing: 8px; text-transform: uppercase; font-family: 'Lalezar', 'Cairo', sans-serif; font-size: 26px; }
.err { color: var(--red); font-weight: 600; min-height: 22px; text-align: center; margin: 10px 0 0; font-size: 14px; }

/* ===== الانتظار ===== */
#wait .me { width: 210px; height: 210px; margin: 12px auto 0; }
#wait h2 { font-family: 'Lalezar', sans-serif; font-weight: 400; font-size: 30px; margin: 6px 0 2px; }
#wait .sub { color: var(--muted); margin-bottom: 16px; text-align: center; }
.roster { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 440px; }
.roster .p { display: flex; flex-direction: column; align-items: center; width: 66px; font-size: 12px; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.roster .p span { max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes pop { from { transform: scale(.3); opacity: 0 } }
.vipbox { margin-top: auto; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-top: 16px; }
.hint { color: var(--muted); font-size: 13px; text-align: center; }

/* ===== اللعب ===== */
#game { position: fixed; inset: 0; background: #05060b; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.topbar { position: absolute; top: calc(8px + var(--safe-t)); left: 10px; right: 10px; display: flex; align-items: center; gap: 10px; }
.roundbtn {
  width: 48px; height: 48px; border-radius: 16px; border: 1px solid var(--line); background: rgba(10, 12, 24, .55);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; font-size: 24px; flex: none;
}
.roundbtn:active { transform: scale(.94); }
.taskbar { flex: 1; height: 48px; border-radius: 16px; background: rgba(10, 12, 24, .55); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 7px 12px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.taskbar .row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); }
.taskbar .bar { height: 9px; border-radius: 6px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.taskbar .fill { height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, #1fb89b, #4ff0d0); box-shadow: 0 0 12px rgba(52, 224, 192, .7); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.roompill {
  position: absolute; top: calc(66px + var(--safe-t)); left: 50%; transform: translateX(-50%) translateY(-10px); opacity: 0;
  padding: 6px 18px; border-radius: 99px; background: rgba(10, 12, 24, .7); border: 1px solid var(--line);
  font: 400 20px 'Lalezar', 'Cairo', sans-serif; transition: opacity .35s, transform .35s; pointer-events: none; white-space: nowrap;
}
.roompill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.tasklist {
  position: absolute; top: calc(66px + var(--safe-t)); right: 10px; width: min(300px, 78vw); border-radius: 18px; padding: 10px 12px;
  background: rgba(10, 12, 24, .82); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transform-origin: top right; transition: transform .25s, opacity .25s;
}
.tasklist.closed { transform: scale(.9); opacity: 0; pointer-events: none; }
.tasklist h4 { margin: 2px 0 8px; font: 400 18px 'Lalezar', sans-serif; color: var(--gold); display: flex; justify-content: space-between; }
.tasklist .t { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 14px; border-top: 1px solid rgba(255, 255, 255, .06); }
.tasklist .t .room { color: var(--muted); font-size: 12px; margin-inline-start: auto; }
.tasklist .t.done { color: #6c7088; text-decoration: line-through; }
.tasklist .t .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); flex: none; }
.tasklist .t.done .dot { background: var(--teal); box-shadow: none; }
.tasklist .t .step { font-size: 11px; color: var(--gold); }

.actions { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(14px + var(--safe-b)); display: grid; grid-template-columns: auto auto; gap: 12px; align-items: end; direction: ltr; }
.act {
  width: 84px; height: 84px; border-radius: 26px; border: 1px solid rgba(255, 255, 255, .2);
  background: radial-gradient(120% 120% at 30% 20%, rgba(255, 255, 255, .22), rgba(255, 255, 255, .04));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center;
  font: 800 13px 'Cairo', sans-serif; gap: 2px; position: relative; transition: transform .1s, opacity .25s, box-shadow .25s; color: #fff;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
}
.act .ico { font-size: 34px; }
.act.big { width: 104px; height: 104px; border-radius: 32px; }
.act.big .ico { font-size: 44px; }
.act:active { transform: scale(.93); }
.act.off { opacity: .32; }
.act.use.on { background: radial-gradient(120% 120% at 30% 20%, #ffe3a3, #e8963a); color: #2a1606; box-shadow: 0 0 30px rgba(246, 197, 107, .65); }
.act.report.on { background: radial-gradient(120% 120% at 30% 20%, #ffb36b, #e2541d); box-shadow: 0 0 34px rgba(255, 120, 40, .8); animation: pulse 1s infinite; }
.act.kill.on { background: radial-gradient(120% 120% at 30% 20%, #ff8c96, #c21d3a); box-shadow: 0 0 34px rgba(255, 60, 80, .8); }
.act.sab { width: 64px; height: 64px; border-radius: 20px; }
.act.sab .ico { font-size: 26px; }
.act.sab.on { background: radial-gradient(120% 120% at 30% 20%, #b48cff, #6d28d9); }
.act .cd { position: absolute; inset: 0; display: grid; place-items: center; font: 400 38px 'Lalezar', sans-serif; color: #fff; text-shadow: 0 2px 10px #000; }
@keyframes pulse { 50% { transform: scale(1.06) } }

.joyzone { position: absolute; left: 0; bottom: 0; width: 58%; height: 62%; }
.joy { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .05); pointer-events: none; opacity: 0; transition: opacity .15s; }
.joy.on { opacity: 1; }
.joy .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #cfd3e6); box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
.joyhint { position: absolute; left: calc(26px + env(safe-area-inset-left, 0px)); bottom: calc(26px + var(--safe-b)); width: 110px; height: 110px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .18); display: grid; place-items: center; color: rgba(255, 255, 255, .35); font-size: 12px; text-align: center; pointer-events: none; transition: opacity .5s; }

.banner {
  position: absolute; top: calc(110px + var(--safe-t)); left: 50%; transform: translateX(-50%); min-width: 240px; max-width: 92vw; text-align: center;
  padding: 10px 16px; border-radius: 16px; font-weight: 800; font-size: 15px; pointer-events: none; display: flex; flex-direction: column; gap: 2px;
  background: rgba(120, 10, 25, .82); border: 1px solid rgba(255, 90, 100, .6); box-shadow: 0 0 30px rgba(255, 40, 60, .45); animation: bannerIn .4s;
}
.banner.dim { background: rgba(20, 24, 50, .85); border-color: rgba(120, 140, 255, .5); box-shadow: 0 0 30px rgba(80, 100, 255, .35); }
.banner .big { font: 400 26px 'Lalezar', sans-serif; }
.banner .valves { display: flex; gap: 12px; justify-content: center; font-size: 13px; }
.banner .valves .ok { color: #4ff0d0; }
@keyframes bannerIn { from { transform: translateX(-50%) translateY(-20px); opacity: 0 } }
.edge-red { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(255, 30, 50, .55); animation: edge 1s infinite; }
@keyframes edge { 50% { box-shadow: inset 0 0 40px rgba(255, 30, 50, .2); } }

.toast { position: fixed; bottom: calc(130px + var(--safe-b)); left: 50%; transform: translateX(-50%); background: rgba(10, 12, 24, .9); border: 1px solid var(--line); padding: 10px 18px; border-radius: 14px; font-weight: 700; z-index: 90; animation: bannerIn .3s; pointer-events: none; white-space: nowrap; }

/* ===== طبقات فوق اللعب ===== */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(4, 5, 12, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: calc(14px + var(--safe-t)) 14px calc(14px + var(--safe-b)); animation: fadeIn .25s; }
@keyframes fadeIn { from { opacity: 0 } }

/* مهمة */
.mg { width: min(94vw, 470px); max-height: 96%; display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; background: linear-gradient(180deg, #1b2036, #10131f); border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 30px 80px rgba(0, 0, 0, .6); animation: mgIn .35s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes mgIn { from { transform: scale(.85) translateY(30px); opacity: 0 } }
.mg header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.mg header h3 { margin: 0; font: 400 22px 'Lalezar', sans-serif; flex: 1; }
.mg header .room { color: var(--muted); font-size: 13px; }
.mg .close { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); font-size: 20px; display: grid; place-items: center; }
.mg .stage { position: relative; width: 100%; aspect-ratio: 1; touch-action: none; }
.mg .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.mg .help { padding: 10px 14px 14px; color: var(--muted); font-size: 14px; text-align: center; min-height: 44px; }
.mg .done { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 40, 30, .55); animation: fadeIn .2s; }
.mg .done div { font: 400 44px 'Lalezar', sans-serif; color: #4ff0d0; text-shadow: 0 0 24px rgba(52, 224, 192, .9); animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); display: flex; align-items: center; gap: 10px; }
.mg .done .ico { font-size: 46px; }

/* كشف الدور */
.reveal { text-align: center; }
.reveal .holdbox { width: min(84vw, 360px); aspect-ratio: .78; border-radius: 30px; position: relative; perspective: 900px; }
.reveal .face { position: absolute; inset: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .55s cubic-bezier(.3, 1.4, .5, 1); border: 1px solid rgba(255, 255, 255, .2); }
.reveal .front { background: linear-gradient(160deg, #262b45, #12152a); }
.reveal .front .q { font: 400 110px 'Lalezar', sans-serif; color: rgba(255, 255, 255, .15); line-height: 1; }
.reveal .back { transform: rotateY(180deg); }
.reveal.open .front { transform: rotateY(-180deg); }
.reveal.open .back { transform: rotateY(0); }
.reveal .back.crew { background: radial-gradient(120% 90% at 50% 0%, #1f8c78, #0b2a2a 70%); box-shadow: 0 0 60px rgba(52, 224, 192, .35); }
.reveal .back.imp { background: radial-gradient(120% 90% at 50% 0%, #b3122e, #2a070e 70%); box-shadow: 0 0 70px rgba(255, 40, 60, .5); }
.reveal .role { font: 400 50px 'Lalezar', sans-serif; margin: 8px 0 0; line-height: 1.15; }
.reveal .desc { color: rgba(255, 255, 255, .8); font-size: 15px; margin-top: 6px; }
.reveal .partners { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.reveal .partners div { display: flex; flex-direction: column; align-items: center; font-weight: 800; color: #ffb3bb; }
.reveal .tip { margin-top: 18px; color: var(--muted); font-size: 14px; }

/* ميت */
.deadscreen { background: radial-gradient(70% 50% at 50% 40%, rgba(120, 10, 30, .35), rgba(3, 3, 8, .96)); }
.deadscreen h1 { font: 400 64px 'Lalezar', sans-serif; margin: 10px 0 0; color: #ff6b78; text-shadow: 0 0 40px rgba(255, 40, 60, .6); }
.deadscreen p { color: var(--muted); text-align: center; max-width: 320px; }

/* اجتماع */
.meet { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; background: radial-gradient(90% 60% at 50% 0%, rgba(255, 70, 70, .15), rgba(4, 5, 12, .94)); }
.meet .head { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.meet .head h2 { margin: 0; font: 400 30px 'Lalezar', sans-serif; }
.timer { position: relative; width: 58px; height: 58px; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font: 400 20px 'Lalezar', sans-serif; }
.claims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 480px; }
.chip { height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); font-weight: 700; font-size: 14px; }
.chip.sel { background: rgba(246, 197, 107, .18); border-color: var(--gold); color: var(--gold); }
.voters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 480px; }
.vcard { position: relative; border-radius: 18px; border: 2px solid var(--line); background: var(--glass); padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; font-weight: 700; font-size: 13px; transition: transform .15s, border-color .15s, background .15s; }
.vcard.dead { opacity: .35; filter: grayscale(.8); }
.vcard.sel { border-color: var(--gold); background: rgba(246, 197, 107, .14); transform: scale(1.04); }
.vcard.partner span { color: #ff7d8a; }
.vcard .claim { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 2px; min-height: 16px; }
.vcard .badge { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #052; display: grid; place-items: center; font-size: 15px; }
.vcard .votes { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 12px; margin-top: 4px; }
.vcard .votes i { width: 11px; height: 11px; border-radius: 50%; background: #fff; display: block; animation: pop .4s; }
.skiprow { display: flex; gap: 10px; width: 100%; max-width: 480px; margin-top: 12px; }
.skiprow .btn { flex: 1; }
.meet .note { color: var(--muted); font-size: 14px; margin: 12px 0; text-align: center; }

/* لوحات */
.panel { width: min(96vw, 520px); border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #171b2e, #0d1020); border: 1px solid rgba(255, 255, 255, .15); display: flex; flex-direction: column; max-height: 96%; }
.panel header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.panel header h3 { margin: 0; flex: 1; font: 400 22px 'Lalezar', sans-serif; }
.panel canvas { width: 100%; display: block; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; touch-action: pan-x; }
.tabs .chip { flex: none; padding: 0 14px; height: 40px; }
.sabgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.sabbtn { height: 70px; border-radius: 18px; border: 1px solid rgba(180, 140, 255, .4); background: rgba(109, 40, 217, .25); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; }
.sabbtn .ico { font-size: 26px; }
.sabbtn[disabled] { opacity: .35; }

/* النهاية */
.endscreen h1 { font: 400 72px 'Lalezar', sans-serif; margin: 0; line-height: 1.1; }
.endscreen.win h1 { color: #ffd789; text-shadow: 0 0 50px rgba(255, 200, 80, .6); }
.endscreen.lose h1 { color: #ff6b78; text-shadow: 0 0 50px rgba(255, 40, 60, .55); }
.endscreen .who { display: flex; gap: 14px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
.endscreen .who div { display: flex; flex-direction: column; align-items: center; font-weight: 800; }

.flash { position: fixed; inset: 0; pointer-events: none; z-index: 80; animation: flash .7s forwards; }
@keyframes flash { from { opacity: 1 } to { opacity: 0 } }
.intro { text-align: center; }
.intro h1 { font: 400 84px 'Lalezar', sans-serif; margin: 0; color: #ff4d5e; text-shadow: 0 0 60px rgba(255, 40, 60, .8); animation: slam .5s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes slam { from { transform: scale(2.4); opacity: 0 } }
.rotate-hint { position: fixed; inset: 0; z-index: 99; background: var(--bg); display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; }

.roundbtn.ping { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246,197,107,.35), 0 0 24px rgba(246,197,107,.6); animation: pulse 0.9s infinite; color: var(--gold); }
</style>
</head>

      s.textContent = document.getElementById('src-' + mode).textContent;
      document.body.appendChild(s);
    });
  }
  if (qs.get('r')) { boot('phone'); return; }
  document.getElementById('goHost').onclick = function () { boot('host'); };
  document.getElementById('goPhone').onclick = function () { boot('phone'); };
})();
</script>
</body>
